# Independent Discovery stack. Does not require another teammate's service.
# docker compose -f discovery/compose.standalone.yml up --build
name: discovery-independent
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:15673:15672"
    volumes:
      - broker-data:/var/lib/rabbitmq
  discovery-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: discovery
      POSTGRES_PASSWORD: discovery
      POSTGRES_DB: discovery
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discovery"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - database-data:/var/lib/postgresql/data
  model:
    build:
      context: ..
      dockerfile: discovery/Dockerfile
    command: ["uvicorn", "discovery.testing.ollama_stub:app", "--host", "0.0.0.0", "--port", "11434"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11434/api/tags')"]
      interval: 3s
      timeout: 3s
      retries: 20
  discovery:
    build:
      context: ..
      dockerfile: discovery/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://discovery:discovery@discovery-db:5432/discovery
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      OLLAMA_URL: http://model:11434
      EMBEDDING_PROVIDER: simulated_http
      DISCOVERY_ADMIN_TOKEN: local-learning-only
      NOTIONAL_PRICE_PER_TOKEN: "0.000001"
    ports:
      - "127.0.0.1:8004:8000"
    depends_on:
      discovery-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  catalogue-fixture:
    build:
      context: ..
      dockerfile: discovery/Dockerfile
    command: ["python", "-m", "discovery.scripts.publish_events"]
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      discovery:
        condition: service_healthy
volumes:
  database-data:
  broker-data:
