# One-command startup: `docker compose up --build`
#
# Shared broker and Ticketing, plus Payment and its monitoring dashboard.
# Each service owns its own PostgreSQL database.

name: citytickets

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI (guest / guest)
      - "15692:15692"   # Prometheus metrics
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Declares every exchange, queue, retry queue and DLQ, then exits.
  topology-init:
    build:
      context: .
      dockerfile: shared/Dockerfile
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"     # SMTP
      - "8025:8025"     # inbox in the browser: http://localhost:8025

  ticketing-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    volumes:
      - ticketing-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing"]
      interval: 3s
      timeout: 3s
      retries: 30

  ticketing:
    build:
      context: .
      dockerfile: notification/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://ticketing:ticketing@ticketing-db:5432/ticketing
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      MAILHOG_API: http://mailhog:8025
    ports:
      - "8005:8000"     # GET /tickets/{booking_id}, /metrics
    depends_on:
      ticketing-db:
        condition: service_healthy
      topology-init:
        condition: service_completed_successfully
      # Deliberately not depending on mailhog: Ticketing must start and keep
      # issuing tickets while the mail server is down.

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - payment-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment"]
      interval: 3s
      timeout: 3s
      retries: 30

  payment:
    build:
      context: .
      dockerfile: payment/Dockerfile
    environment:
      DATABASE_URL: postgresql://payment:payment@payment-db:5432/payment
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_MODE: ${PAYMENT_MODE:-ok}
      PAYMENT_DELAY: ${PAYMENT_DELAY:-0}
      PAYMENT_ERROR_RATE: ${PAYMENT_ERROR_RATE:-0}
    ports:
      - "8004:8000"
    depends_on:
      payment-db:
        condition: service_healthy
      topology-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-stagedoor-demo}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  ticketing-db:
  payment-db:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
