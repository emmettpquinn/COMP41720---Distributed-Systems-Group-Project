# One-command startup: `docker compose up --build`
#

name: citytickets

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI (guest / guest)
      - "15692:15692"   # Prometheus metrics
    volumes:
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Declares every exchange, queue, retry queue and DLQ, then exits.
  topology-init:
    build:
      context: .
      dockerfile: shared/Dockerfile
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"     # SMTP
      - "8025:8025"     # inbox in the browser: http://localhost:8025

  ticketing-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    volumes:
      - ticketing-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing"]
      interval: 3s
      timeout: 3s
      retries: 30

  ticketing:
    build:
      context: .
      dockerfile: notification/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://ticketing:ticketing@ticketing-db:5432/ticketing
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      MAILHOG_API: http://mailhog:8025
    ports:
      - "8005:8000"     # GET /tickets/{booking_id}, /metrics
    depends_on:
      ticketing-db:
        condition: service_healthy
      topology-init:
        condition: service_completed_successfully
      # Deliberately not depending on mailhog: Ticketing must start and keep
      # issuing tickets while the mail server is down.

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    volumes:
      - payment-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 3s
      timeout: 3s
      retries: 30

  payment:
    build:
      context: .
      dockerfile: payment/Dockerfile
    environment:
      DATABASE_URL: postgresql://payment:payment@payment-db:5432/payment
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_MODE: ${PAYMENT_MODE:-ok}
      PAYMENT_DELAY: ${PAYMENT_DELAY:-0}
      PAYMENT_ERROR_RATE: ${PAYMENT_ERROR_RATE:-0}
    ports:
      - "8004:8000"
    depends_on:
      payment-db:
        condition: service_healthy
      topology-init:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      CATALOGUE_URL: http://catalogue:8000
      BOOKING_URL: http://booking:8000
      TICKETING_URL: http://ticketing:8000
      UPSTREAM_TIMEOUT_SECONDS: "3"
      BOOKING_HOLDS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8000"
    depends_on:
      catalogue:
        condition: service_healthy

  catalogue-db:
    image: postgres:16-alpine
    environment:
      # Local development credentials only.
      POSTGRES_USER: catalogue
      POSTGRES_PASSWORD: catalogue
      POSTGRES_DB: catalogue
    volumes:
      - catalogue-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogue -d catalogue"]
      interval: 3s
      timeout: 3s
      retries: 30

  catalogue-migrate:
    build:
      context: .
      dockerfile: catalogue/Dockerfile
    command: ["python", "-m", "app.db"]
    environment:
      DATABASE_URL: postgresql://catalogue:catalogue@catalogue-db:5432/catalogue
      DATABASE_TIMEOUT_SECONDS: "2"
    depends_on:
      catalogue-db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  catalogue-seed:
    build:
      context: .
      dockerfile: catalogue/Dockerfile
    command: ["python", "-m", "app.seed"]
    environment:
      DATABASE_URL: postgresql://catalogue:catalogue@catalogue-db:5432/catalogue
    depends_on:
      catalogue-migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: "no"

  catalogue:
    build:
      context: .
      dockerfile: catalogue/Dockerfile
    environment:
      DATABASE_URL: postgresql://catalogue:catalogue@catalogue-db:5432/catalogue
      DATABASE_TIMEOUT_SECONDS: "2"
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      CATALOGUE_MESSAGING_ENABLED: ${CATALOGUE_MESSAGING_ENABLED:-false}
    ports:
      - "8001:8000"
    depends_on:
      catalogue-db:
        condition: service_healthy
      catalogue-migrate:
        condition: service_completed_successfully
      catalogue-seed:
        condition: service_completed_successfully
      topology-init:
        condition: service_completed_successfully

volumes:
  ticketing-db:
  payment-db:
  catalogue-db:
