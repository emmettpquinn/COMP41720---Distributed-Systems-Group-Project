name: Discovery verification
on:
  pull_request:
    paths: ['discovery/**', 'shared/**', '.github/workflows/discovery.yml']
  push:
    branches: ['eoin/**', 'feature/discovery*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: discovery
          POSTGRES_PASSWORD: discovery
          POSTGRES_DB: discovery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U discovery -d discovery_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: discovery/requirements-lock.txt
      - run: python -m pip install -r discovery/requirements-lock.txt
      - name: Unit and SQLite tests
        run: python -m pytest -c discovery/pytest.ini discovery/tests -q
      - name: PostgreSQL and pgvector tests
        env:
          DISCOVERY_TEST_DATABASE_URL: postgresql+asyncpg://discovery:discovery@localhost:5432/discovery_test
        run: python -m pytest -c discovery/pytest.ini discovery/tests -q
      - name: Real HTTP failure rehearsal with explicit model simulator
        run: python -m discovery.scripts.rehearse --output work/rehearsal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-http-evidence
          path: work/rehearsal/
  independent-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start own database, broker, model simulator and Discovery
        run: |
          docker compose -f discovery/compose.standalone.yml up --build -d --wait discovery
          docker compose -f discovery/compose.standalone.yml run --rm catalogue-fixture
      - name: Verify real broker and PostgreSQL path
        run: docker compose -f discovery/compose.standalone.yml exec -T discovery python -m discovery.scripts.verify_stack
      - name: Logs
        if: always()
        run: docker compose -f discovery/compose.standalone.yml logs --no-color
      - name: Stop disposable stack
        if: always()
        run: docker compose -f discovery/compose.standalone.yml down
