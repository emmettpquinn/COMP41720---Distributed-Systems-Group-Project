# LOCAL DEVELOPMENT ONLY. The credentials below are fake dev values, not real secrets.
# Starts just Postgres and RabbitMQ (with its management page) for the Booking service.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: booking_dev
      POSTGRES_PASSWORD: dev_password_only
      POSTGRES_DB: booking
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # messages from services
      - "15672:15672"   # management page: http://localhost:15672
